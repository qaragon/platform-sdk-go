          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: "Get a platform identity by ID, scoped to the calling tenant"
      tags:
      - Identities
    put:
      description: |-
        Text fields are overwritten as-sent (omission blanks them); image
