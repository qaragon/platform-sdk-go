          application/json:
            schema:
              $ref: "#/components/schemas/fansfeud.LibraryGenerationRequest"
        description: Content brief and requested set count
        required: true
        x-originalParamName: request
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fansfeud.LibraryGenerationResponse"
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Bad Request
        "401":
