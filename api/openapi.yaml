        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/submission.ViewListResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: List accepted submissions for a target
      tags:
      - Submissions
    post:
      description: "The single submission endpoint. target.type is contest or game;\
        \ target.id is its ID. For hosted cross-tenant submissions, include space_id\
        \ and platform_identity_id. payload carries solutions (MCQ/Prediction), option_ids\
        \ (Vote/Game), key (CheckIn), guess (repeated Guess), answers (final-board\
        \ Guess), action for Game control submissions, or media_url/media_type/duration\
        \ (Creative). Game rules select the managed Contest internally. Repeated exact\
        \ Guess returns 200 with a committed result; final-board Guess returns 202,\
        \ records the final answer list through the shared queue, and grades at Contest\
        \ closure. Other queued mechanics return 202 after durable acceptance. Read\
        \ the accepted submission, participation, entry or game for subsequent processing\
        \ state. Repeatable Guess requires Idempotency-Key. Submitted ballots are\
        \ final."
      operationId: createSubmissions
      parameters:
      - description: "Retry key; reuse only for the same identity, target, and action"
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
        style: simple
      - description: Acting-as. The platform identity id (piid) this request is on
          behalf of. The platform verifies the piid belongs to the calling tenant
          and acts as that identity. Omit for tenant-level calls.
        explode: false
        in: header
        name: X-Acting-As
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/submission.Request"
        description: Submission target and type-specific payload
        required: true
        x-originalParamName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/submission.ReceiptResponse"
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/submission.ReceiptResponse"
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: Submit to a Contest or Game
      tags:
      - Submissions
