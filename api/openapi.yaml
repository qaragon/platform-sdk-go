  /v2/identities:
    post:
      description: |-
        The platform mints the piid (ADR 0033). Supply an optional
        Idempotency-Key header to make a create retry-safe (ADR 0055):
        while the replay record lives (~24h) the same key + same body
        replays the original 201; reusing the key with a different body
        returns 422; a concurrent in-flight retry returns 409. Profile
        mutations land via PUT, never via repeat POST. metadata is
        opaque and echoed verbatim.
      operationId: createIdentities
      parameters:
      - description: Retry key (~24h). Same key + same body replays the original response;
          a different body returns 422.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
        style: simple
      - description: Acting-as. The platform identity id (piid) this request is on
          behalf of. The platform verifies the piid belongs to the calling tenant
          and acts as that identity. Omit for tenant-level calls.
        explode: false
        in: header
        name: X-Acting-As
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlatformIdentityRequest"
        description: Platform identity payload
        required: true
        x-originalParamName: identity
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identities.PlatformIdentityResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
