            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: Read platform answer-board library generation settings
      tags:
      - Content administration
  /v2/admin/answer-boards/generation/{kind}:
    put:
      description: "Platform-admin only. The daily 02:00 UTC job queues the requested\
        \ community-board batch for every enabled setting, independently of library\
        \ size and review backlog. Generated content requires human approval. Generation\
        \ is disabled by default."
      operationId: updateAdminAnswerBoardsGenerationByKind
