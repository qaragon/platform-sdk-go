        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/answerboards.GenerationSettings"
        description: Operating settings
        required: true
        x-originalParamName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/answerboards.GenerationSettingsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: Configure scheduled library generation
      tags:
      - Content administration
  /v2/admin/games/fans-feud/library/generate:
    post:
      description: "Platform-admin only. Enqueues fresh sets for the selected type:\
        \ fans_feud (10 questions), feud_showdown (5), or feud_rush (5). Questions\
        \ are English and suitable for a broad audience. Uses the same generation/review\
        \ as creator drafts. No automatic paid retries. Poll the returned ID for progress;\
        \ completed status/results are retained for 24 hours."
      operationId: createAdminGamesFansFeudLibraryGenerate
      parameters:
      - description: Replay an identical request instead of enqueuing another paid
          batch
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
        style: simple
      - description: Acting-as. The platform identity id (piid) this request is on
