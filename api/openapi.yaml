paths:
  /v2/admin/answer-boards:
    get:
      description: Qaragon platform administrators only. Includes hidden answers and
        review metadata; ordinary tenant administrators have no access. Generation
        success leaves candidates pending review.
      operationId: getAdminAnswerBoards
      parameters:
      - description: Board kind
        explode: true
        in: query
        name: kind
        required: true
        schema:
          enum:
          - word_chain
          - word_reveal
          type: string
        style: form
      - description: Review status
        explode: true
        in: query
        name: status
        required: false
        schema:
          default: pending_review
          enum:
          - pending_review
          - approved
          - rejected
          type: string
        style: form
      - description: Last board ID from the previous page
        explode: true
        in: query
        name: after
        required: false
        schema:
          type: string
        style: form
      - description: Page size (1–100)
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - description: Acting-as. The platform identity id (piid) this request is on
          behalf of. The platform verifies the piid belongs to the calling tenant
          and acts as that identity. Omit for tenant-level calls.
        explode: false
        in: header
        name: X-Acting-As
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/answerboards.ReviewBoardListResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: Browse answer boards for publication review
      tags:
      - Content administration
  /v2/admin/answer-boards/{id}:
    get:
      description: "Qaragon platform administrators only. Reads pending, approved\
        \ or rejected content without changing publication status."
      operationId: getAdminAnswerBoardsById
      parameters:
      - description: Namespaced board ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Acting-as. The platform identity id (piid) this request is on
          behalf of. The platform verifies the piid belongs to the calling tenant
          and acts as that identity. Omit for tenant-level calls.
        explode: false
        in: header
        name: X-Acting-As
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/answerboards.ReviewBoardResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: Read a candidate answer board with hidden answers
      tags:
      - Content administration
  /v2/admin/answer-boards/{id}/review:
    put:
      description: "Qaragon platform administrators only. Records the authenticated\
        \ reviewer and decision time. Repeating a decision preserves its audit. Approval\
        \ affects future selection, never content already committed to Contests or\
        \ Games."
      operationId: updateAdminAnswerBoardsByIdReview
      parameters:
      - description: Namespaced board ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Acting-as. The platform identity id (piid) this request is on
          behalf of. The platform verifies the piid belongs to the calling tenant
          and acts as that identity. Omit for tenant-level calls.
        explode: false
        in: header
        name: X-Acting-As
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/answerboards.ReviewRequest"
        description: Publication decision
        required: true
        x-originalParamName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/answerboards.ReviewBoardResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/httpx.ErrorResponse"
          description: Internal Server Error
      summary: Approve or reject an answer board for library publication
      tags:
      - Content administration
  /v2/admin/answer-boards/generation:
