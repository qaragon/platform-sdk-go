        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformIdentityRequest"
        description: Profile fields
        required: true
        x-originalParamName: profile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/identities.PlatformIdentityResponse"
          description: OK
        "400":
          content:
            application/json:
